name: alos

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: alos
      POSTGRES_USER: alos
      POSTGRES_PASSWORD: ${ALOS_POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${ALOS_POSTGRES_PORT:-5433}:5432"
    volumes:
      - alos-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alos -d alos"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  alos-postgres:

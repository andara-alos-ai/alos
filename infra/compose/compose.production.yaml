name: alos-production

x-platform-environment: &platform-environment
  ALOS_APPLICATION_NAME: ALOS
  ALOS_ENVIRONMENT: production
  ALOS_LOG_LEVEL: ${ALOS_LOG_LEVEL:-INFO}
  ALOS_API_HOST: 0.0.0.0
  ALOS_API_PORT: "8000"
  ALOS_WEB_ORIGIN: https://${ALOS_PUBLIC_HOST:?set ALOS_PUBLIC_HOST}
  ALOS_DATABASE_URL: ${ALOS_DATABASE_URL:?set managed PostgreSQL URL}
  ALOS_AUTH_ISSUER: ${ALOS_AUTH_ISSUER:-alos-production}
  ALOS_AUTH_AUDIENCE: alos-platform
  ALOS_AUTH_SIGNING_SECRET: ${ALOS_AUTH_SIGNING_SECRET:?set signing secret}
  ALOS_AUTH_TOKEN_TTL_SECONDS: ${ALOS_AUTH_TOKEN_TTL_SECONDS:-3600}
  ALOS_OBJECT_STORAGE_PROVIDER: s3
  ALOS_OBJECT_STORAGE_BUCKET: ${ALOS_OBJECT_STORAGE_BUCKET:?set S3 or R2 bucket}
  ALOS_OBJECT_STORAGE_ENDPOINT_URL: ${ALOS_OBJECT_STORAGE_ENDPOINT_URL:-}
  ALOS_OBJECT_STORAGE_REGION: ${ALOS_OBJECT_STORAGE_REGION:-auto}
  ALOS_OBJECT_STORAGE_ACCESS_KEY_ID: ${ALOS_OBJECT_STORAGE_ACCESS_KEY_ID:-}
  ALOS_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${ALOS_OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
  ALOS_OBJECT_STORAGE_FORCE_PATH_STYLE: ${ALOS_OBJECT_STORAGE_FORCE_PATH_STYLE:-false}
  ALOS_OBJECT_STORAGE_SERVER_SIDE_ENCRYPTION: ${ALOS_OBJECT_STORAGE_SERVER_SIDE_ENCRYPTION:-AES256}
  ALOS_OBJECT_STORAGE_MAX_UPLOAD_BYTES: ${ALOS_OBJECT_STORAGE_MAX_UPLOAD_BYTES:-26214400}
  ALOS_MIGRATIONS_PATH: /app/infra/database
  ALOS_LLM_PROVIDER: ${ALOS_LLM_PROVIDER:-disabled}
  ALOS_LLM_API_KEY: ${ALOS_LLM_API_KEY:-}
  ALOS_LLM_MODEL: ${ALOS_LLM_MODEL:-}
  ALOS_LLM_MODEL_LIGHT: ${ALOS_LLM_MODEL_LIGHT:-}
  ALOS_LLM_MODEL_STANDARD: ${ALOS_LLM_MODEL_STANDARD:-}
  ALOS_LLM_MODEL_CRITICAL: ${ALOS_LLM_MODEL_CRITICAL:-}
  ALOS_LLM_BASE_URL: ${ALOS_LLM_BASE_URL:-}
  ALOS_LLM_TIMEOUT_SECONDS: ${ALOS_LLM_TIMEOUT_SECONDS:-60}
  ALOS_LLM_STORE_RESPONSES: "false"
  ALOS_LLM_REASONING_EFFORT: ${ALOS_LLM_REASONING_EFFORT:-medium}
  ALOS_LLM_MAX_OUTPUT_TOKENS: ${ALOS_LLM_MAX_OUTPUT_TOKENS:-3000}
  ALOS_LLM_MAX_CONTEXT_TOKENS: ${ALOS_LLM_MAX_CONTEXT_TOKENS:-12000}
  ALOS_LLM_MAX_DATA_CLASSIFICATION: ${ALOS_LLM_MAX_DATA_CLASSIFICATION:-INTERNAL}
  ALOS_LLM_DAILY_REQUEST_LIMIT: ${ALOS_LLM_DAILY_REQUEST_LIMIT:-500}
  ALOS_LLM_DAILY_OUTPUT_TOKEN_LIMIT: ${ALOS_LLM_DAILY_OUTPUT_TOKEN_LIMIT:-500000}
  ALOS_LLM_DAILY_COST_CAP_USD: ${ALOS_LLM_DAILY_COST_CAP_USD:-5.00}

services:
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/platform.Dockerfile
    command: ["python", "-m", "alos.persistence.migrations"]
    environment: *platform-environment
    restart: "no"

  platform:
    build:
      context: ../..
      dockerfile: infra/docker/platform.Dockerfile
    environment: *platform-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/platform.Dockerfile
    command: ["python", "-m", "alos.jobs.worker"]
    environment: *platform-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    build:
      context: ../..
      dockerfile: infra/docker/platform.Dockerfile
    command: ["python", "-m", "alos.jobs.scheduler"]
    environment: *platform-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_ALOS_API_URL: /api/v1
    depends_on:
      platform:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: caddy:2.10.2-alpine
    environment:
      ALOS_PUBLIC_HOST: ${ALOS_PUBLIC_HOST:?set ALOS_PUBLIC_HOST}
      ALOS_TLS_EMAIL: ${ALOS_TLS_EMAIL:?set ALOS_TLS_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - alos-caddy-data:/data
      - alos-caddy-config:/config
    depends_on:
      platform:
        condition: service_healthy
    restart: unless-stopped

volumes:
  alos-caddy-data:
  alos-caddy-config:

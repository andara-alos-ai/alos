name: alos-internal-application

x-platform-environment: &platform-environment
  ALOS_ENVIRONMENT: ${ALOS_ENVIRONMENT:-staging}
  ALOS_REPOSITORY_ROOT: /app
  ALOS_DATABASE_URL: postgresql+psycopg://alos:${ALOS_POSTGRES_PASSWORD}@postgres:5432/alos
  ALOS_AUTH_ISSUER: ${ALOS_AUTH_ISSUER:-alos-internal}
  ALOS_AUTH_AUDIENCE: ${ALOS_AUTH_AUDIENCE:-alos-internal}
  ALOS_AUTH_SIGNING_SECRET: ${ALOS_AUTH_SIGNING_SECRET}
  ALOS_WEB_ORIGIN: ${ALOS_WEB_ORIGIN:-http://localhost:3000}
  ALOS_OBJECT_STORAGE_PROVIDER: ${ALOS_OBJECT_STORAGE_PROVIDER:-filesystem}
  ALOS_OBJECT_STORAGE_PATH: /app/data/objects
  ALOS_OBJECT_STORAGE_BUCKET: ${ALOS_OBJECT_STORAGE_BUCKET:-alos-documents}
  ALOS_OBJECT_STORAGE_ENDPOINT_URL: ${ALOS_OBJECT_STORAGE_ENDPOINT_URL:-}
  ALOS_OBJECT_STORAGE_REGION: ${ALOS_OBJECT_STORAGE_REGION:-us-east-1}
  ALOS_OBJECT_STORAGE_ACCESS_KEY: ${ALOS_OBJECT_STORAGE_ACCESS_KEY:-}
  ALOS_OBJECT_STORAGE_SECRET_KEY: ${ALOS_OBJECT_STORAGE_SECRET_KEY:-}
  ALOS_DOCUMENT_SCAN_MODE: ${ALOS_DOCUMENT_SCAN_MODE:-external}
  ALOS_LLM_PROVIDER: ${ALOS_LLM_PROVIDER:-disabled}
  ALOS_LLM_API_KEY: ${ALOS_LLM_API_KEY:-}
  ALOS_LLM_MODEL: ${ALOS_LLM_MODEL:-}
  ALOS_LLM_BASE_URL: ${ALOS_LLM_BASE_URL:-}
  ALOS_LLM_MAX_DATA_CLASSIFICATION: ${ALOS_LLM_MAX_DATA_CLASSIFICATION:-INTERNAL}
  ALOS_N8N_ENABLED: ${ALOS_N8N_ENABLED:-false}
  ALOS_N8N_WEBHOOK_URL: ${ALOS_N8N_WEBHOOK_URL:-}
  ALOS_N8N_WEBHOOK_SECRET: ${ALOS_N8N_WEBHOOK_SECRET:-}

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: alos
      POSTGRES_USER: alos
      POSTGRES_PASSWORD: ${ALOS_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alos -d alos"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.platform
    command: ["python", "-m", "alos.persistence.migrations"]
    environment: *platform-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.platform
    environment: *platform-environment
    volumes:
      - object-data:/app/data/objects
    ports:
      - "${ALOS_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.platform
    command: ["python", "-m", "alos.entrypoints.worker", "--loop"]
    environment: *platform-environment
    volumes:
      - object-data:/app/data/objects
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "alos.entrypoints.worker_health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_ALOS_API_URL: ${NEXT_PUBLIC_ALOS_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_ALOS_PILOT_LOGIN_ENABLED: ${NEXT_PUBLIC_ALOS_PILOT_LOGIN_ENABLED:-false}
    ports:
      - "${ALOS_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  object-data:

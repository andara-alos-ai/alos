[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "alos-platform"
version = "0.1.0"
description = "Backend modular dan shared Agent Runtime ALOS"
requires-python = ">=3.12,<3.14"
dependencies = [
  "boto3>=1.43.81,<2",
  "fastapi[standard]==0.141.1",
  "httpx>=0.28,<1",
  "pyjwt[crypto]>=2.10,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.43,<3",
  "psycopg[binary]>=3.2.9,<4",
]

[project.scripts]
alos-migrate = "alos.persistence.migrations:main"
alos-validate-sources = "alos.genesis.source.cli:main"
alos-validate-configuration = "alos.governance.configuration.cli:main"
alos-verify-audit = "alos.audit.cli:main"

[project.optional-dependencies]
dev = [
  "boto3-stubs[s3]>=1.43.83,<2",
  "httpx2>=2.12,<3",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["src/alos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "postgres: requires the local PostgreSQL integration service"
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

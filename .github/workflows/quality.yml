name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_DB: alos
          POSTGRES_USER: alos
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alos -d alos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ALOS_DATABASE_URL: postgresql+psycopg://alos:ci-password@127.0.0.1:5432/alos
      ALOS_RUN_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/platform/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Install platform dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "services/platform[dev]"
      - name: Apply immutable migrations
        run: python -m alos.persistence.migrations
      - name: Static analysis and dependency audit
        run: |
          pnpm --filter @andara/alos-web lint
          pnpm --filter @andara/alos-web typecheck
          python -m ruff check services/platform/src services/platform/tests
          python -m mypy services/platform/src
          python -m pip_audit
      - name: Test application and fresh PostgreSQL migrations
        run: |
          pnpm --filter @andara/alos-web test -- --run
          python -m pytest services/platform/tests
      - name: Build web production artifact
        run: pnpm --filter @andara/alos-web build

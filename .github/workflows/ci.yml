name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "services/platform[dev]"
      - run: python -m ruff check services/platform
      - run: python -m mypy services/platform/src
      - run: python -m pytest services/platform/tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v2
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @andara/alos-web lint
      - run: pnpm --filter @andara/alos-web typecheck
      - run: pnpm --filter @andara/alos-web test
      - run: pnpm --filter @andara/alos-web build

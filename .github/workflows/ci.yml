name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: alos
          POSTGRES_USER: alos
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alos -d alos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALOS_ENVIRONMENT: test
      ALOS_DATABASE_URL: postgresql+psycopg://alos:ci-only-password@localhost:5432/alos
      ALOS_AUTH_SIGNING_SECRET: ci-only-signing-secret-change-before-release
      ALOS_RUN_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "services/platform[dev]"
      - run: python -m ruff check services/platform
      - run: python -m ruff check services/platform/src --select S
      - run: python -m mypy services/platform/src
      - run: python -m alos.persistence.migrations
      - run: python -m pytest services/platform/tests
      - run: python -m pip_audit --local --skip-editable --progress-spinner off
      - name: Scan tracked files for credential patterns
        shell: bash
        run: |
          if git grep -n -I -E 'AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- . ':!pnpm-lock.yaml'; then
            echo "Potential credential detected in tracked files"
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v2
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @andara/alos-web lint
      - run: pnpm --filter @andara/alos-web typecheck
      - run: pnpm --filter @andara/alos-web test
      - run: pnpm --filter @andara/alos-web build
      - run: pnpm audit --prod --audit-level high
